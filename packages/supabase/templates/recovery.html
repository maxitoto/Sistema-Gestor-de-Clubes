    <body>
        <h1>Establecé tu contraseña</h1>
        <p>Recibiste un enlace para configurar o restablecer la contraseña de tu cuenta en el sistema del club. Este enlace se usa una sola vez y vence a los 15 minutos.</p>

        <p>Si no esperabas este correo, podés ignorarlo.</p>
    </body>
